# Place at: .github/workflows/build-image.yml
#
# Phase 1: build container image(s). Nothing goes to a registry.
#   - Manual run          -> build only (use it to test a branch)
#   - Release published   -> build, then attach the image as a .tar.gz to that release
#   - Plain tag push      -> nothing happens
# Phase 2 (once you have Entra ID / Azure permissions): see the "PHASE 2" markers.

name: Build container image

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to upload the image to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Repo with a single Dockerfile in the root: keep only this entry ---
          - name: app
            context: .
            dockerfile: ./Dockerfile

          # --- Repo with frontend/backend: delete the entry above, use these ---
          # - name: frontend
          #   context: ./frontend
          #   dockerfile: ./frontend/Dockerfile
          # - name: backend
          #   context: ./backend
          #   dockerfile: ./backend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # PHASE 2: log in to Azure + ACR here, e.g.
      # - uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # - run: az acr login --name <your-acr>

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false        # PHASE 2: change to true and prefix images with <acr>.azurecr.io/
          load: true         # keeps the image in the runner for the steps below
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Only for releases: export the image and attach it to the release.
      # To use it later: gunzip -c <file> | docker load   (then retag + push to ACR)
      - name: Export image
        if: github.event_name == 'release'
        run: |
          FILE="${{ matrix.name }}-${{ github.event.release.tag_name }}.tar.gz"
          docker save $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ') | gzip > "$FILE"
          ls -lh "$FILE"
          echo "IMAGE_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Attach image to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$IMAGE_FILE" \
            --repo "${{ github.repository }}" --clobber

      # PHASE 2: deploy step, e.g.
      # - uses: azure/container-apps-deploy-action@v2
      #   with:
      #     imageToDeploy: <acr>.azurecr.io/<image>:${{ github.sha }}
      #     resourceGroup: <rg>
      #     containerAppName: <app>
