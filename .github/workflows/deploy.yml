# GitHub Actions workflow demonstrating Docker containers and MongoDB service integration
# Demonstrates: container execution, service containers, environment variables, caching, and job dependencies
# Use case: Test Node.js application with MongoDB database in isolated container environment
name: Build container
on:
  push:
    branches:
      - main  # Trigger on push to main branch
      - dev   # Trigger on push to dev branch
      - docker-build-action # Trigger on push

permissions:
  contents: 'read'
  packages: 'write'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Github container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ github.sha }}
          file: ./Dockerfile