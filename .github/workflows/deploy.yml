# GitHub Actions workflow demonstrating Docker containers and MongoDB service integration
# Demonstrates: container execution, service containers, environment variables, caching, and job dependencies
# Use case: Test Node.js application with MongoDB database in isolated container environment
name: Build container
on:
  push:
    branches:
      - main  # Trigger on push to main branch
      - dev   # Trigger on push to dev branch

permissions:
  contents: 'read'
  packages: 'write'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b

      - name: Log in to Github container registry
        uses: docker/login-action@8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB-REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
        with:
          push: false
          tags: ghcr.io/${{ env.REPO }}:${{ github:sha }}
          file: ./Dockerfile